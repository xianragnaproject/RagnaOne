# Ping Cursor Cloud Agent every 20 minutes so the VM stays RUNNING.
# Required repo secret: CURSOR_API_KEY (Cloud Agents API key from cursor.com/dashboard)
# Optional repo variable: CURSOR_AGENT_ID (defaults to the 40-bot fleet agent)
name: cloud-agent-ping-keepalive

on:
  schedule:
    # Every 20 minutes — enough to stop IDLE/archive for week-long fleet tests
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ping Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AGENT_ID: ${{ vars.CURSOR_AGENT_ID || 'bc-44af0d07-7e5a-499a-a294-839d21459cac' }}
        run: bash scripts/cloud-agent-ping-keepalive.sh
